<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e6458">
  <title>تهيئة مدير مكتبة الطب</title>
  <style>
    body{margin:0;background:#f4f7f3;color:#16332f;font:16px Tahoma,Arial,sans-serif}.card{max-width:560px;margin:7vh auto;padding:26px;background:#fff;border:1px solid #dce7df;border-radius:18px}h1{font-size:22px}p{line-height:1.8;color:#637b76}label{display:block;margin:14px 0 6px;font-size:14px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dce7df;border-radius:9px;font:inherit}button{margin-top:18px;background:#0e6458;color:#fff;border:0;cursor:pointer}.message{margin-top:14px;padding:12px;background:#edf5ee;border-radius:9px;line-height:1.7}.error{background:#fae9e6;color:#852d24}
  </style>
</head>
<body><main class="card"><h1>إنشاء حساب مدير النظام</h1><p>تظهر هذه الصفحة لإعداد المدير الأول فقط. أدخل رمز التهيئة الذي أضفته مؤقتًا إلى إعدادات الخدمة، ثم احتفظ ببيانات الدخول بمكان آمن.</p>
<form id="setup"><label>رمز التهيئة</label><input name="pin" type="password" required autocomplete="off"><label>اسم المدير</label><input name="name" required><label>اسم المستخدم</label><input name="username" required autocomplete="username"><label>كلمة المرور (12 حرفًا على الأقل)</label><input name="password" type="password" required minlength="12" autocomplete="new-password"><button>إنشاء حساب المدير</button></form><div id="message" class="message" hidden></div></main>
<script>document.querySelector("#setup").addEventListener("submit",async event=>{event.preventDefault();const box=document.querySelector("#message");box.hidden=false;box.className="message";box.textContent="جارٍ إنشاء الحساب…";try{const response=await fetch("/api/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget)))});const data=await response.json();if(!response.ok)throw Error(data.error||"تعذر إنشاء الحساب");event.currentTarget.reset();box.textContent="تم إنشاء المدير. احذف ADMIN_SETUP_PIN من إعدادات Render، ثم ارجع للصفحة الرئيسية وسجل الدخول."}catch(error){box.className="message error";box.textContent=error.message}});</script></body></html>
